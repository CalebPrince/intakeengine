<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Admin — IntakeEngine</title>
<script>
  (function () {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/theme.css" rel="stylesheet">
<style>
  .card-metric { background:var(--app-surface); border:1px solid var(--app-border); }
  .card-metric .value { font-size:1.8rem; font-weight:700; color:var(--app-text); }
  .card-metric .label { color:var(--app-text-muted); font-size:.8rem; }
  .card-auth { background:var(--app-surface); border:1px solid var(--app-border); max-width:380px; }
  .form-control, .form-select { background:var(--app-input-bg); border-color:var(--app-border-strong); color:var(--app-text); }
  .form-control:focus, .form-select:focus { background:var(--app-input-bg); color:var(--app-text); border-color:var(--app-brand); box-shadow:0 0 0 .2rem rgba(59,130,246,.25); }
  .btn-brand { background:var(--app-brand); border:none; }
  .btn-brand:hover { background:var(--app-brand-hover); }
  .table { color:var(--app-text); }
  .table > :not(caption) > * > * { background:var(--app-surface); border-color:var(--app-border); color:var(--app-text); }
  label { color:var(--app-text-muted); }
  pre.log-line { background:var(--app-bg); border:1px solid var(--app-border); padding:.5rem; border-radius:.3rem; font-size:.75rem; white-space:pre-wrap; color:var(--app-text); }
  .card-message { background:var(--app-surface); border:1px solid var(--app-border); border-radius:.4rem; padding:.75rem 1rem; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold">IntakeEngine <span class="text-muted small">· Global Command Station</span></span>
    <div class="d-flex gap-2 align-items-center">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌙</button>
      <button id="logoutBtn" class="btn btn-outline-app btn-sm d-none">Sign out</button>
    </div>
  </div>
</nav>

<div id="loginView" class="d-flex justify-content-center py-5">
  <div class="card card-auth p-4 w-100 mx-3">
    <h5 class="mb-3">Admin sign in</h5>
    <form id="adminLoginForm">
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="adminEmail" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" id="adminPassword" required></div>
      <div id="loginError" class="alert alert-danger py-2 small d-none"></div>
      <button class="btn btn-brand w-100">Sign in</button>
    </form>
  </div>
</div>

<div id="consoleView" class="container-fluid px-4 d-none">
  <div class="row g-3 mb-4" id="metricsRow"></div>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-tab="tenants">Tenant Registry</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="messages">Contact Messages</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="logs">Runtime Logs</button></li>
  </ul>

  <div id="tab-tenants" class="tab-pane">
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr><th>Subdomain</th><th>Business</th><th>Owner</th><th>Tier</th><th>Status</th><th>Disk</th><th></th></tr></thead>
        <tbody id="tenantsBody"><tr><td colspan="7" class="text-muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-messages" class="tab-pane d-none">
    <div id="messagesList" class="d-flex flex-column gap-2"></div>
  </div>

  <div id="tab-logs" class="tab-pane d-none">
    <div class="row g-4">
      <div class="col-md-6">
        <h6>System logs</h6>
        <div id="systemLogs" class="d-flex flex-column gap-1"></div>
      </div>
      <div class="col-md-6">
        <h6>Webhook events</h6>
        <div id="webhookLogs" class="d-flex flex-column gap-1"></div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
