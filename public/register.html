<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your workspace — IntakeEngine</title>
<script>
  (function () {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/theme.css" rel="stylesheet">
<style>
  body { min-height:100vh; }
  .card-auth { background:var(--app-surface); border:1px solid var(--app-border); color:var(--app-text); max-width:460px; }
  .form-control { background:var(--app-input-bg); border-color:var(--app-border-strong); color:var(--app-text); }
  .form-control:focus { background:var(--app-input-bg); color:var(--app-text); border-color:var(--app-brand); box-shadow:0 0 0 .2rem rgba(var(--app-brand-rgb),.25); }
  .btn-brand { background:var(--app-brand); border:none; }
  .btn-brand:hover { background:var(--app-brand-hover); }
  .form-text, label { color:var(--app-text-muted); }
</style>
</head>
<body class="d-flex flex-column py-5">
<div class="d-flex justify-content-end mx-3 mb-3" style="max-width:460px; width:100%; margin-inline:auto;">
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌙</button>
</div>
<div class="d-flex align-items-center justify-content-center flex-grow-1">
<div class="card card-auth p-4 w-100 mx-3">
  <h4 class="mb-1">Create your workspace</h4>
  <p class="text-muted-2 small mb-4">Free to start — no card required.</p>

  <form id="registerForm">
    <div class="mb-3">
      <label class="form-label">Business name</label>
      <input type="text" class="form-control" id="business_name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Owner email</label>
      <input type="email" class="form-control" id="owner_email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" minlength="8" required>
      <div class="form-text">At least 8 characters.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Choose your subdomain</label>
      <div class="input-group">
        <input type="text" class="form-control" id="subdomain" pattern="[a-z0-9-]{3,63}" required placeholder="accraclinic">
        <span class="input-group-text" style="background:var(--app-input-bg);color:var(--app-text-muted);border-color:var(--app-border-strong);">.localhost:8090</span>
      </div>
    </div>
    <div id="formError" class="alert alert-danger py-2 small d-none"></div>
    <div id="formSuccess" class="alert alert-success py-2 small d-none"></div>
    <button type="submit" class="btn btn-brand w-100">Create workspace</button>
  </form>
  <p class="text-center small mt-3">Already have a workspace? <a href="/login.html">Sign in</a></p>
</div>
</div>

<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const errorBox = document.getElementById('formError');
  const successBox = document.getElementById('formSuccess');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    const payload = {
      business_name: document.getElementById('business_name').value.trim(),
      owner_email: document.getElementById('owner_email').value.trim(),
      password: document.getElementById('password').value,
      subdomain: document.getElementById('subdomain').value.trim().toLowerCase(),
    };

    try {
      const res = await Api.post('/api/v1/register', payload);
      const url = `${location.protocol}//${res.subdomain}.localhost:8090/login.html`;
      successBox.textContent = `Workspace created! Redirecting you to sign in at ${res.subdomain}.localhost:8090 ...`;
      successBox.classList.remove('d-none');
      setTimeout(() => { location.href = url; }, 1400);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
