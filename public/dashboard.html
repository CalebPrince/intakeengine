<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace — IntakeEngine</title>
<script>
  (function () {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/theme.css" rel="stylesheet">
<style>
  .card-metric { background:var(--app-surface); border:1px solid var(--app-border); }
  .card-metric .value { font-size:2rem; font-weight:700; color:var(--app-text); }
  .card-metric .label { color:var(--app-text-muted); font-size:.85rem; }
  .nav-tabs .nav-link { color:var(--app-text-muted); border:none; }
  .nav-tabs .nav-link.active { color:var(--app-text); background:transparent; border-bottom:2px solid var(--app-brand); }
  .table { color:var(--app-text); }
  .table > :not(caption) > * > * { background:var(--app-surface); border-color:var(--app-border); color:var(--app-text); }
  .form-control, .form-select { background:var(--app-input-bg); border-color:var(--app-border-strong); color:var(--app-text); }
  .form-control:focus, .form-select:focus { background:var(--app-input-bg); color:var(--app-text); border-color:var(--app-brand); box-shadow:0 0 0 .2rem rgba(59,130,246,.25); }
  .btn-brand { background:var(--app-brand); border:none; color:#fff; }
  .btn-brand:hover { background:var(--app-brand-hover); color:#fff; }
  .card-panel { background:var(--app-surface); border:1px solid var(--app-border); }
  .field-row { border:1px solid var(--app-border); border-radius:.4rem; }
  .modal-content { background:var(--app-surface); color:var(--app-text); }
  .badge-status { text-transform:capitalize; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-bold">IntakeEngine <span id="subdomainLabel" class="text-muted small"></span></span>
    <div class="d-flex gap-2 align-items-center">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌙</button>
      <a id="bookLink" href="#" target="_blank" class="btn btn-outline-app btn-sm">View public booking page</a>
      <button id="logoutBtn" class="btn btn-outline-app btn-sm">Sign out</button>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card card-metric p-3">
        <div class="value" id="metricUpcoming">—</div>
        <div class="label">Upcoming bookings</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-metric p-3">
        <div class="value" id="metricMonthly">—</div>
        <div class="label">Intake forms this month</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-metric p-3">
        <div class="value" id="metricNewCustomers">—</div>
        <div class="label">New customers this month</div>
      </div>
    </div>
  </div>

  <ul class="nav nav-tabs mb-3" id="mainTabs">
    <li class="nav-item"><button class="nav-link active" data-tab="registry">Live Intake Registry</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="forms">Form Builder</button></li>
  </ul>

  <div id="tab-registry" class="tab-pane">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <select id="statusFilter" class="form-select form-select-sm" style="width:auto;">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="accepted">Accepted</option>
        <option value="rescheduled">Rescheduled</option>
        <option value="cancelled">Cancelled</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr><th>Customer</th><th>Form</th><th>Status</th><th>Scheduled</th><th>Submitted</th><th></th></tr></thead>
        <tbody id="bookingsBody"><tr><td colspan="6" class="text-muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-forms" class="tab-pane d-none">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card card-panel p-3">
          <h6>Your forms</h6>
          <div id="formsList" class="list-group list-group-flush mb-3"></div>
          <div class="input-group input-group-sm">
            <input type="text" id="newFormName" class="form-control" placeholder="New form name">
            <button id="createFormBtn" class="btn btn-brand">Add</button>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card card-panel p-3" id="fieldsPanel">
          <p class="text-muted">Select a form to edit its questions.</p>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Booking detail</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody">Loading…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
