<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — IntakeEngine</title>
<script>
  (function () {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/theme.css" rel="stylesheet">
<style>
  body { min-height:100vh; }
  .card-auth { background:var(--app-surface); border:1px solid var(--app-border); color:var(--app-text); max-width:420px; }
  .form-control { background:var(--app-input-bg); border-color:var(--app-border-strong); color:var(--app-text); }
  .form-control:focus { background:var(--app-input-bg); color:var(--app-text); border-color:var(--app-brand); box-shadow:0 0 0 .2rem rgba(var(--app-brand-rgb),.25); }
  .btn-brand { background:var(--app-brand); border:none; }
  .btn-brand:hover { background:var(--app-brand-hover); }
  label { color:var(--app-text-muted); }
  #hostNotice { color:var(--app-text-muted); }
</style>
</head>
<body class="d-flex flex-column py-5">
<div class="d-flex justify-content-end mx-3 mb-3" style="max-width:420px; width:100%; margin-inline:auto;">
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌙</button>
</div>
<div class="d-flex align-items-center justify-content-center flex-grow-1">
<div class="card card-auth p-4 w-100 mx-3">
  <h4 class="mb-1">Sign in to your workspace</h4>
  <p id="hostNotice" class="small mb-4"></p>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label">Owner email</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div id="formError" class="alert alert-danger py-2 small d-none"></div>
    <button type="submit" class="btn btn-brand w-100">Sign in</button>
  </form>
  <p class="text-center small mt-3"><a href="/register.html">Create a workspace instead</a></p>
</div>
</div>

<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script>
  const parts = location.hostname.split('.');
  const onApex = parts.length < 2 || (parts.length === 2 && parts[0] === 'www');
  const notice = document.getElementById('hostNotice');
  if (onApex) {
    notice.innerHTML = 'You\'re on the main site. Sign in from your own workspace address, e.g. <code>yourbusiness.localhost:8090</code>.';
  } else {
    notice.textContent = `Workspace: ${parts[0]}`;
  }

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('formError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('d-none');
    try {
      await Api.post('/api/v1/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      location.href = '/dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
