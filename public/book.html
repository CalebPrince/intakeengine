<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<script>
  (function () {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/theme.css" rel="stylesheet">
<style>
  .card-form { background:var(--app-surface); border:1px solid var(--app-border); max-width:640px; }
  .form-control, .form-select { background:var(--app-input-bg); border-color:var(--app-border-strong); color:var(--app-text); }
  .form-control:focus, .form-select:focus { background:var(--app-input-bg); color:var(--app-text); border-color:var(--app-brand); box-shadow:0 0 0 .2rem rgba(var(--app-brand-rgb),.25); }
  .btn-brand { background:var(--app-brand); border:none; }
  .btn-brand:hover { background:var(--app-brand-hover); }
  label { color:var(--app-text-muted); }
</style>
</head>
<body class="py-5">
<div class="container">
  <div class="d-flex justify-content-end mx-auto mb-3" style="max-width:640px;">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌙</button>
  </div>
  <div class="card card-form mx-auto p-4" id="root">
    <p class="text-muted">Loading booking form…</p>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/book.js"></script>
<script src="/js/theme.js"></script>
</body>
</html>
