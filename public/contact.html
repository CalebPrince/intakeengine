<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — IntakeEngine</title>
<script>
  (function () {
    var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/theme.css" rel="stylesheet">
<style>
  .hero { padding:4rem 0 2rem; }
  .btn-brand { background:var(--app-brand); color:#fff; border:none; }
  .btn-brand:hover { background:var(--app-brand-hover); color:#fff; }
  .text-muted-2 { color:var(--app-text-muted); }
  .card-auth { background:var(--app-surface); border:1px solid var(--app-border); color:var(--app-text); max-width:560px; }
  .form-control { background:var(--app-input-bg); border-color:var(--app-border-strong); color:var(--app-text); }
  .form-control:focus { background:var(--app-input-bg); color:var(--app-text); border-color:var(--app-brand); box-shadow:0 0 0 .2rem rgba(var(--app-brand-rgb),.25); }
  .form-text, label { color:var(--app-text-muted); }
  footer { color:var(--app-text-muted); border-top:1px solid var(--app-border); }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">IntakeEngine</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4 mt-3 mt-lg-0 gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/#pricing">Pricing</a></li>
        <li class="nav-item"><a class="nav-link active" href="/contact.html">Contact</a></li>
      </ul>
      <div class="d-flex gap-2 align-items-center mt-3 mt-lg-0">
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌙</button>
        <a href="/login.html" class="btn btn-outline-app btn-sm">Sign in</a>
        <a href="/register.html" class="btn btn-brand btn-sm">Get started free</a>
      </div>
    </div>
  </div>
</nav>

<header class="hero text-center">
  <div class="container" style="max-width:600px;">
    <h1 class="display-6">Get in touch</h1>
    <p class="lead mt-2 text-muted-2">Questions about a plan, a bug to report, or Enterprise support — send it over.</p>
  </div>
</header>

<section class="pb-5">
  <div class="container d-flex justify-content-center">
    <div class="card card-auth p-4 w-100 mx-3">
      <form id="contactForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" id="subject" placeholder="Optional">
        </div>
        <div class="mt-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="5" required></textarea>
        </div>
        <div id="formError" class="alert alert-danger py-2 small mt-3 d-none"></div>
        <div id="formSuccess" class="alert alert-success py-2 small mt-3 d-none"></div>
        <button type="submit" class="btn btn-brand w-100 mt-3">Send message</button>
      </form>
    </div>
  </div>
</section>

<footer class="py-4 text-center small">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
    <span>IntakeEngine — built on plain PHP + SQLite, zero dependencies.</span>
    <span class="d-flex gap-3">
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <a href="/admin.html">Platform admin</a>
    </span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/theme.js"></script>
<script>
  const form = document.getElementById('contactForm');
  const errorBox = document.getElementById('formError');
  const successBox = document.getElementById('formSuccess');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    try {
      await Api.post('/api/v1/contact', {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        message: document.getElementById('message').value.trim(),
      });
      form.reset();
      successBox.textContent = 'Thanks — your message has been sent. We\'ll get back to you soon.';
      successBox.classList.remove('d-none');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
